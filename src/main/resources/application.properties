spring.application.name=e-commerce


# ================================
# DataSource (MySQL)
# ================================
# URL JDBC:
# - jdbc:mysql://localhost:3306/ecommerce_db -> host, puerto y nombre de la base.
# - useSSL=false -> util para entorno local sin certificados.
# - serverTimezone=UTC -> evita desfasajes de fecha/hora entre app y BD.
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC
# Credenciales de la base de datos
spring.datasource.username=root
spring.datasource.password=root
# Driver JDBC actual (Connector/J)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ================================
# JPA / Hibernate
# ================================
# Opciones frecuentes: create, update, validate, none
# update: sincroniza el esquema con las entidades (ideal para desarrollo).
spring.jpa.hibernate.ddl-auto=update 
# Muestra las sentencias SQL generadas por Hibernate.
spring.jpa.show-sql=true 
# Formatea las sentencias SQL para mejor legibilidad.
spring.jpa.properties.hibernate.format_sql=true 
# Dialecto SQL para MySQL.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

