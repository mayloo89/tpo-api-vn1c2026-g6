spring.application.name=e-commerce

# H2 Database (se reinicia al parar la app)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console


# 1. Configuración de la Fuente de Datos 
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# 2. Driver específico (Cuidado aquí: si usas MySQL, NO menciones a H2)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# La clave secreta se lee desde la variable de entorno JWT_SECRET.
# En desarrollo usa el valor por defecto; en producción definir JWT_SECRET en el entorno.
jwt.secret=${JWT_SECRET:miClaveSecretaDe32CaracteresParaJWT2025}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — orígenes permitidos separados por coma.
# En producción definir CORS_ALLOWED_ORIGINS con el dominio del frontend.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload de imágenes
app.upload.dir=./uploads
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
